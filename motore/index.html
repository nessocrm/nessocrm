<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nesso</title>
  <style>
    @font-face { font-family: Inter; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/Inter-Regular.woff2") format("woff2"); }
    @font-face { font-family: Inter; font-style: normal; font-weight: 500; font-display: swap; src: url("/fonts/Inter-Medium.woff2") format("woff2"); }
    @font-face { font-family: Inter; font-style: normal; font-weight: 600; font-display: swap; src: url("/fonts/Inter-SemiBold.woff2") format("woff2"); }
    :root { color-scheme: light; --nav-width: 232px; --nav-min: 50px; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, "Segoe UI", sans-serif; font-size: 14px; background: #f1f3f5; color: #262626; line-height: 1.45; }
    a { color: #245b8c; }
    a:hover { color: #1a4163; }
    a:focus-visible, button:focus-visible { outline: 2px solid #66afe9; outline-offset: 2px; }
    .skip { position: absolute; left: 8px; top: -40px; background: #fff; padding: 8px 12px; z-index: 30; }
    .skip:focus { top: 8px; }
    .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .navbar { position: fixed; inset: 0 auto 0 0; width: var(--nav-width); background: #f4f5f7; border-right: 1px solid #e4e6e8; display: flex; flex-direction: column; z-index: 20; }
    .navbar-header { height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 16px; flex: none; }
    .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #8090a0; min-width: 0; }
    .brand:hover { color: #8090a0; }
    .logo { flex: none; }
    .brand-name { font-size: 22px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
    .menu-toggle { display: none; }
    .menu { display: flex; flex-direction: column; padding: 2px 0 8px; overflow: auto; flex: 1; }
    .menu a, .navbar-foot a { display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 0 14px 0 16px; color: #262626; text-decoration: none; font-size: 14px; }
    .menu a:hover, .navbar-foot a:hover { background: #ececed; color: #262626; }
    .menu a[aria-current="page"] { background: #dee1e7; }
    .nav-icon { width: 16px; height: 16px; flex: none; }
    .tab-divider { margin: 16px 16px 4px; font-size: 12px; font-weight: 500; color: #9aa0a6; }
    .navbar-foot { border-top: 1px solid #e6e8eb; padding: 4px 0 6px; flex: none; }
    .lang-switch { display: block; padding: 6px 16px 8px; }
    .lang-switch select { width: 100%; min-height: 32px; }
    button.minimizer, button.menu-toggle { width: 100%; min-height: 36px; border: 0; border-radius: 0; background: transparent; color: #5c5c5c; display: flex; align-items: center; padding: 0 16px; cursor: pointer; }
    button.minimizer:hover, button.menu-toggle:hover { background: #ececed; border: 0; color: #5c5c5c; }
    .minimizer svg, .menu-toggle svg { width: 14px; height: 14px; }
    .content { margin-left: var(--nav-width); min-height: 100vh; }
    body.ingresso .navbar { display: none; }
    body.ingresso .content { margin-left: 0; }
    #esci { display: none; width: calc(100% - 32px); margin: 6px 16px; }
    body.dentro #esci { display: inline-flex; }
    body.gesto-lancia [data-cambia] { display: none !important; }
    .topbar { display: none; }
    main { padding: 8px 16px 56px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; margin: 0 0 6px; }
    .page-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
    h1:focus { outline: none; }
    h2 { font-size: 16px; font-weight: 600; margin: 0; }
    .lead { color: #6a6a6a; margin: 0 0 14px; }
    .step { margin: 0; color: #969696; font-size: 12px; font-weight: 500; }
    .header-buttons, .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .actions { margin-top: 14px; }
    .page-header .actions, .header-buttons { margin-top: 0; }
    button, .btn { font: inherit; font-weight: 500; font-size: 13px; min-height: 30px; border-radius: 4px; padding: 0 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; border: 1px solid #5589ca; background: #5589ca; color: #fff; }
    button:hover, .btn:hover { background: #386fb4; border-color: #386fb4; color: #fff; }
    button:disabled { opacity: .6; cursor: default; }
    button.secondary, a.secondary { background: #fcfcfc; color: #585858; border-color: #c2cacc; }
    button.secondary:hover, a.secondary:hover { background: #f4f4f4; border-color: #bac3c5; color: #585858; }
    button.danger { background: #fcfcfc; color: #c44b66; border-color: #e3b7c2; }
    button.danger:hover { background: #fdf4f6; color: #c44b66; }
    #conferma-si { background: #d7657d; border-color: #d7657d; color: #fff; }
    #conferma-si:hover { background: #cc3d5b; border-color: #cc3d5b; color: #fff; }
    .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 3px; font-size: 12px; font-weight: 600; background: #eaeaea; color: #6a6a6a; white-space: nowrap; }
    .badge.ok { background: #cceed9; color: #246e43; }
    .badge.warn { background: #f9eabb; color: #9f7122; }
    .badge.bad { background: #f8d0d0; color: #8a243c; }
    .panel.bad { border-color: #e3b7c2; }
    .panel, .dashlet { background: #fff; border: 1px solid #e7eaed; border-radius: 4px; padding: 14px 16px; }
    .panel { margin-top: 12px; }
    .dashlets { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 8px; }
    .dashlet { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; margin: 0; }
    .dashlet:hover { border-color: #d5d8dc; color: inherit; }
    .dashlet-title { font-size: 15px; font-weight: 600; }
    .dashlet-count { font-size: 28px; font-weight: 600; line-height: 1.15; margin-top: 6px; }
    .dashlet .hint { margin-top: 4px; }
    form { display: grid; gap: 14px; }
    form.panel { margin-top: 8px; }
    label, .field { display: grid; gap: 4px; font-weight: 600; font-size: 13px; }
    .hint { font-weight: 400; color: #6a6a6a; font-size: 13px; }
    input, select, textarea { font: inherit; font-weight: 400; font-size: 14px; min-height: 32px; padding: 4px 10px; border-radius: 3px; border: 1px solid #d1d5d6; background: #fefefe; color: #262626; width: 100%; }
    textarea { min-height: 96px; padding: 8px 10px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #66afe9; box-shadow: 0 0 0 3px rgba(102, 175, 233, .25); }
    fieldset { border: 1px solid #e7eaed; border-radius: 4px; margin: 0; padding: 12px; display: grid; gap: 8px; }
    legend { font-weight: 600; font-size: 13px; padding: 0 4px; }
    .radios label { font-weight: 400; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
    .radios input { width: auto; margin-top: 3px; }
    .error { color: #ad4846; font-weight: 600; margin: 0; }
    dl { display: grid; grid-template-columns: 11rem 1fr; gap: 6px 12px; margin: 10px 0 0; }
    dt { font-weight: 600; color: #6a6a6a; }
    dd { margin: 0; }
    .table-wrap { padding: 0; overflow: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    caption { text-align: left; font-weight: 600; padding: 12px 14px 0; }
    th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid #eef0f2; vertical-align: top; font-size: 13px; }
    th { font-weight: 600; background: #fafbfc; color: #262626; }
    code { word-break: break-all; font-size: 12px; background: #f7f8f9; border: 1px solid #e7eaed; border-radius: 3px; padding: 1px 4px; }
    dialog { border: 1px solid #e7eaed; border-radius: 4px; padding: 0; max-width: 28rem; width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, .12); }
    dialog::backdrop { background: rgba(38, 38, 38, .35); }
    dialog h2 { margin: 0; padding: 14px 16px; background: #f1f3f5; font-size: 16px; border-bottom: 1px solid #e7eaed; }
    dialog p { margin: 0; padding: 16px; }
    dialog .actions { margin: 0; padding: 12px 16px; background: #f1f3f5; border-top: 1px solid #e7eaed; justify-content: flex-end; }
    summary { cursor: pointer; font-weight: 600; }
    body.nav-min { --nav-width: var(--nav-min); }
    body.nav-min .brand-name, body.nav-min .nav-label, body.nav-min .tab-divider { display: none; }
    body.nav-min .navbar-header { justify-content: center; padding: 0; }
    body.nav-min .menu a, body.nav-min .navbar-foot a { justify-content: center; padding: 0; gap: 0; }
    body.nav-min .minimizer { justify-content: center; padding: 0; }
    body.nav-min .minimizer svg { transform: rotate(180deg); }
    @media print {
      .navbar, .topbar, .skip, .no-print, #annuncio { display: none !important; }
      .content { margin-left: 0; }
      body { background: #fff; }
      .panel { break-inside: avoid; }
    }
    @media (max-width: 760px) {
      .navbar { transform: translateX(-100%); transition: transform .16s ease; }
      body.nav-open .navbar { transform: none; box-shadow: 8px 0 24px rgba(0, 0, 0, .08); }
      .content { margin-left: 0; }
      .topbar { display: flex; align-items: center; height: 44px; padding: 0 8px; }
      button.menu-toggle { display: inline-flex; width: 32px; min-height: 32px; padding: 0; justify-content: center; }
      dl { grid-template-columns: 1fr; }
      .page-header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#contenuto" data-i18n="Vai al contenuto">Vai al contenuto</a>
  <aside class="navbar" id="navbar">
    <div class="navbar-header">
      <a class="brand" href="#/">
        <svg class="logo" viewBox="0 0 26 26" width="26" height="26" aria-hidden="true">
          <rect x="1" y="1" width="11" height="11" rx="2" fill="#8b939c"/>
          <rect x="14" y="1" width="11" height="11" rx="2" fill="#e4a133"/>
          <rect x="1" y="14" width="11" height="11" rx="2" fill="#5589ca"/>
          <rect x="14" y="14" width="11" height="11" rx="2" fill="#58c97a"/>
        </svg>
        <span class="brand-name">Nesso</span>
      </a>
    </div>
    <nav class="menu" aria-label="Sezioni" data-i18n-aria="Sezioni">
      <a href="#/" data-nav="/">
        <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="#8b939c" d="M1 1h6v6H1V1zm8 0h6v6H9V1zM1 9h6v6H1V9zm8 0h6v6H9V9z"/></svg>
        <span class="nav-label" data-i18n="Inizio">Inizio</span>
      </a>
      <div class="tab-divider" data-i18n="Espo">Espo</div>
      <a href="#/schede" data-nav="/schede">
        <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="#d19a2e" d="M2 2h5v5H2V2zm7 0h5v5H9V2zM2 9h5v5H2V9zm7 1.2h5V14H9v-3.8z"/></svg>
        <span class="nav-label" data-i18n="Schede">Schede</span>
      </a>
      <div class="tab-divider" data-i18n="Integrazione">Integrazione</div>
      <a href="#/collegamenti" data-nav="/collegamenti">
        <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="#3a7fc1" d="M6.3 9.7a3.2 3.2 0 0 1 0-4.5l1.8-1.8a3.2 3.2 0 0 1 4.5 4.5L11.4 9l-1.1-1.1 1.2-1.2a1.6 1.6 0 0 0-2.3-2.3L7.4 6.2a1.6 1.6 0 0 0 0 2.3l.4.4-1.1 1.1-.4-.3zm3.4-3.4a3.2 3.2 0 0 1 0 4.5l-1.8 1.8a3.2 3.2 0 0 1-4.5-4.5L4.6 7l1.1 1.1-1.2 1.2a1.6 1.6 0 0 0 2.3 2.3l1.8-1.8a1.6 1.6 0 0 0 0-2.3l-.4-.4 1.1-1.1.4.3z"/></svg>
        <span class="nav-label" data-i18n="Collegamenti">Collegamenti</span>
      </a>
      <a href="#/integrazioni" data-nav="/integrazioni">
        <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="#2f9e8f" d="M1.5 4h9.1l-1.8-1.8 1.1-1.1L14 5.2l-4.1 4.1-1.1-1.1L10.6 6.4H1.5V4zm13 6.4H5.4l1.8 1.8-1.1 1.1L2 9.2l4.1-4.1 1.1 1.1-1.8 1.8h9.1v1.6z"/></svg>
        <span class="nav-label" data-i18n="Integrazioni">Integrazioni</span>
      </a>
      <a href="#/attivita" data-nav="/attivita">
        <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="#6b7280" d="M2 3h2v2H2V3zm4 0h8v2H6V3zM2 7h2v2H2V7zm4 0h8v2H6V7zM2 11h2v2H2v-2zm4 0h8v2H6v-2z"/></svg>
        <span class="nav-label" data-i18n="Attività">Attività</span>
      </a>
    </nav>
    <div class="navbar-foot">
      <label class="lang-switch"><span class="sr" data-i18n="Lingua">Lingua</span>
        <select id="lingua" aria-label="Lingua">
          <option value="it">Italiano</option>
          <option value="en">English</option>
        </select>
      </label>
      <a id="espo" href="http://localhost:8088" target="_blank" rel="noopener">
        <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="#5589ca" d="M3 2h6.2L13 5.8V14H3V2zm6 1.2V6h2.8L9 3.2zM4.5 8h7v1.2h-7V8zm0 2.4h7V12h-7v-1.6z"/></svg>
        <span class="nav-label">EspoCRM</span>
      </a>
      <button type="button" class="secondary" id="esci">Esci</button>
      <button type="button" class="minimizer" id="nav-min" aria-label="Riduci il menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M10.2 2.4 4.6 8l5.6 5.6-1.1 1.1L2.4 8l6.7-6.7 1.1 1.1z"/></svg>
      </button>
    </div>
  </aside>
  <div class="content">
    <header class="topbar">
      <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Apri il menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M1 3h14v1.6H1V3zm0 4.2h14v1.6H1V7.2zM1 11.4h14V13H1v-1.6z"/></svg>
      </button>
    </header>
    <main id="contenuto" tabindex="-1"></main>
  </div>
  <p id="annuncio" class="sr" aria-live="polite"></p>
  <dialog id="conferma">
    <h2 id="conferma-titolo" data-i18n="Conferma">Conferma</h2>
    <p id="conferma-testo"></p>
    <div class="actions">
      <button type="button" class="secondary" id="conferma-no">Annulla</button>
      <button type="button" class="danger" id="conferma-si">Elimina</button>
    </div>
  </dialog>
  <script>
    let lang = localStorage.getItem("nesso-lang") === "en" ? "en" : "it";
    let en = {};
    const kindLabel = { webhook: "Webhook", database: "Database", csv: "File CSV", pdf: "PDF sul cliente", http: "Uscita HTTP" };
    const phrases = { creato: "Creato in Espo", aggiornato: "Aggiornato", invariato: "Invariato", synced: "Sincronizzato", inviato: "Inviato", ricevuto: "Ricevuto", scartato: "Scartato", errore: "Errore", ok: "Riuscito", lettura: "Solo lettura", conferma: "Chiusure da confermare", "in coda": "In coda da guardare", mancante: "File atteso non arrivato" };
    const main = document.querySelector("#contenuto");
    const dialog = document.querySelector("#conferma");
    let catalog = [];
    let espoUrl = "http://localhost:8088";
    let state = { connections: [], pipelines: [], queue: [], deliveries: [], rejects: [], runs: [] };
    let session = null;
    function changes() { return session && session.gesture === "cambia"; }
    let health = { espo: "in attesa", fields: "" };
    let draft = null;
    let lastPath = "";

    function patternEn(raw) {
      const rules = [
        [/^Ogni giorno alle (.+)$/, found => "Every day at " + found[1]],
        [/^Ogni (\d+) minuti$/, found => "Every " + found[1] + " minutes"],
        [/^Passo (\d+) di 4$/, found => "Step " + found[1] + " of 4"],
        [/^Abbinamento (\d+)$/, found => "Mapping " + found[1]],
        [/^(\d+) create, (\d+) aggiornate, (\d+) chiuse, (\d+) scartate(.*)$/, found => found[1] + " created, " + found[2] + " updated, " + found[3] + " closed, " + found[4] + " rejected" + (found[5] === ", senza scrivere" ? ", without writing" : found[5])],
        [/^(.+), passo (\d+)$/, found => t(found[1]) + ", step " + found[2]],
        [/^(.+): il file atteso non è stato elaborato\.$/, found => found[1] + ": the expected file has not been processed."],
        [/^Quadratura: (.+)\.$/, found => "Balance: " + balanceRest(found[1]) + "."],
        [/^Quadratura rossa: (.+)\.$/, found => "Balance is off: " + balanceRest(found[1]) + "."],
        [/^Ripristinati (\d+) campi, lasciati (\d+)\.$/, found => "Restored " + found[1] + " fields, kept " + found[2] + "."],
        [/^Chiuse (\d+)\.$/, found => "Closed " + found[1] + "."]
      ];
      for (const [rule, fill] of rules) {
        const found = raw.match(rule);
        if (found) return fill(found);
      }
      return "";
    }
    function balanceRest(text) {
      return text
        .replace(/(\d+) solo in sorgente/g, "$1 only in the source")
        .replace(/(\d+) solo in Espo/g, "$1 only in Espo")
        .replace(/(\d+) in sorgente/g, "$1 in the source")
        .replace(/scarto importi ([0-9.\-]+)/g, "amount gap $1");
    }
    function t(source, vars) {
      const raw = String(source ?? "");
      let modello = lang === "en" ? (en[raw] || patternEn(raw) || raw) : raw;
      if (vars) Object.keys(vars).forEach(name => { modello = modello.split("{" + name + "}").join(String(vars[name] ?? "")); });
      return modello;
    }
    function frase(item) {
      if (!item) return "";
      if (typeof item === "string") return t(item);
      const params = Object.assign({}, item.textParams || {});
      if (params.testo) params.testo = t(params.testo);
      if (item.textKey) return t(item.textKey, params);
      return t(item.text || "");
    }
    function translateTree(root) {
      if (!root || lang !== "en") return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(item => {
        const raw = item.nodeValue;
        const trimmed = raw.trim();
        if (trimmed.length < 2) return;
        const done = t(trimmed);
        if (done === trimmed) return;
        const lead = raw.match(/^\s*/)[0];
        const tail = raw.match(/\s*$/)[0];
        item.nodeValue = lead + done + (tail === raw ? "" : tail);
      });
      root.querySelectorAll("[placeholder], [aria-label]").forEach(el => {
        ["placeholder", "aria-label"].forEach(attr => {
          const value = el.getAttribute(attr);
          if (!value) return;
          const done = t(value);
          if (done !== value) el.setAttribute(attr, done);
        });
      });
    }
    function applyChrome() {
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(node => { node.textContent = t(node.getAttribute("data-i18n")); });
      document.querySelectorAll("[data-i18n-aria]").forEach(node => { node.setAttribute("aria-label", t(node.getAttribute("data-i18n-aria"))); });
      const menuBtn = document.querySelector("#menu-toggle");
      const minBtn = document.querySelector("#nav-min");
      if (menuBtn) menuBtn.setAttribute("aria-label", t("Apri il menu"));
      if (minBtn) minBtn.setAttribute("aria-label", t("Riduci il menu"));
      document.querySelector("#conferma-no").textContent = t("Annulla");
      document.querySelector("#conferma-si").textContent = t("Elimina");
      const lingua = document.querySelector("#lingua");
      if (lingua) {
        lingua.value = lang;
        lingua.setAttribute("aria-label", t("Lingua"));
      }
    }
    const _fetch = window.fetch.bind(window);
    window.fetch = (url, opts) => {
      const options = opts ? Object.assign({}, opts) : {};
      const headers = new Headers(options.headers || {});
      if (!headers.has("X-Nesso-Lang")) headers.set("X-Nesso-Lang", lang);
      options.headers = headers;
      return _fetch(url, options);
    };
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function pathOf() {
      const raw = (location.hash || "#/").replace(/^#/, "");
      const path = raw.startsWith("/") ? raw : "/" + raw;
      return path.replace(/\/+$/, "") || "/";
    }
    function say(text) { document.querySelector("#annuncio").textContent = text; }
    function entityOf(name) { return catalog.find(item => item.name === name); }
    function connectionOf(id) { return (state.connections || []).find(item => item.id === id); }
    function fieldChoices(entityName, linksToo) {
      const entity = entityOf(entityName);
      const structural = new Set(["link", "linkMultiple", "linkParent"]);
      return (entity ? entity.fields : []).filter(field => linksToo || !structural.has(field.type));
    }
    function multiLinks(entityName, foreign) {
      const entity = entityOf(entityName);
      return (entity ? entity.fields : []).filter(field => field.type === "linkMultiple" && (!foreign || field.foreignEntity === foreign));
    }
    function options(items, valueKey, labelKey, selected) {
      return items.map(item => `<option value="${esc(item[valueKey])}" ${item[valueKey] === selected ? "selected" : ""}>${esc(item[labelKey])}</option>`).join("");
    }

    function shell(title, html) {
      document.title = t(title) + " · Nesso";
      main.innerHTML = html;
      translateTree(main);
      applyChrome();
      const here = pathOf();
      document.querySelectorAll("[data-nav]").forEach(link => {
        const on = here === link.dataset.nav || (link.dataset.nav !== "/" && here.startsWith(link.dataset.nav));
        if (on) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
      document.body.classList.remove("nav-open");
      const heading = main.querySelector("h1");
      if (heading && lastPath && here !== lastPath) {
        heading.tabIndex = -1;
        heading.focus();
      }
      lastPath = here;
    }

        location.hash = "#/collegamenti";
      });
    }

              <a class="btn secondary" data-cambia href="#/integrazioni/modifica/${esc(item.id)}/1">Modifica</a>
              ${item.silence_held ? `<button type="button" data-silence-ok="${esc(item.id)}">Conferma il file</button><button type="button" class="secondary" data-silence-drop="${esc(item.id)}">Scarta il file</button>` : ""}
              <button type="button" class="secondary" data-cambia data-pause="${esc(item.id)}" data-enabled="${item.enabled === 0 ? "0" : "1"}">${item.enabled === 0 ? "Riattiva" : "Metti in pausa"}</button>
              <button type="button" class="danger" data-cambia data-del-p="${esc(item.id)}" data-name="${esc(item.name)}">Elimina</button>
            </div>
            <p class="hint" data-msg="${esc(item.id)}" role="status"></p>
          </article>`;
        }).join("") || `<p class="panel">Nessuna integrazione.</p>`}
        ${planPanel()}
        ${silencePanel()}
        <div class="panel">
          <h2>Configurazione</h2>
          <p class="hint">Il file non contiene le password. Su un altro ambiente vanno riscritte.</p>
          <div class="actions">
            <button type="button" id="export-config">Scarica</button>
            <label class="btn secondary" data-cambia>Carica<input id="import-config" type="file" accept="application/json,.json" hidden></label>
          </div>
          <p class="hint">Il foglio è l'abbinamento: colonna, campo, trasformazione, padrone, obbligatorio. Il JSON resta per spostare la configurazione.</p>
          <div class="actions">
            <button type="button" class="secondary" id="export-sheet">Scarica il foglio</button>
            <label class="btn secondary" data-cambia>Carica il foglio<input id="import-sheet" type="file" accept=".csv,text/csv" hidden></label>
          </div>
        </div>
      `);
      bindDelete();
      main.querySelectorAll("[data-run]").forEach(button => button.addEventListener("click", () => execute(button.dataset.run, true)));
      main.querySelectorAll("[data-dry]").forEach(button => button.addEventListener("click", () => dry(button.dataset.dry)));
      main.querySelectorAll("[data-preview]").forEach(button => button.addEventListener("click", () => previewRun(button.dataset.preview)));
      main.querySelectorAll("[data-read]").forEach(button => button.addEventListener("click", () => setReading(button.dataset.read, button.dataset.on !== "1")));
      main.querySelectorAll("[data-undo]").forEach(button => button.addEventListener("click", () => undoRun(button.dataset.undo)));
      main.querySelectorAll("[data-close]").forEach(button => button.addEventListener("click", () => confirmCloses(button.dataset.close)));
      main.querySelectorAll("[data-pause]").forEach(button => button.addEventListener("click", () => toggleEnabled(button.dataset.pause, button.dataset.enabled !== "1")));
      main.querySelectorAll("[data-silence-ok]").forEach(button => button.addEventListener("click", () => silenceFile(button.dataset.silenceOk, "conferma")));
      main.querySelectorAll("[data-silence-drop]").forEach(button => button.addEventListener("click", () => silenceFile(button.dataset.silenceDrop, "scarta")));
      const savePlan = document.querySelector("#salva-piano");
      if (savePlan) savePlan.addEventListener("click", storePlan);
      document.querySelectorAll("[data-step-ok]").forEach(button => button.addEventListener("click", () => confirmStep(button.dataset.stepOk)));
      const addWindow = document.querySelector("#aggiungi-finestra");
      if (addWindow) addWindow.addEventListener("click", storeWindow);
      document.querySelectorAll("[data-window-del]").forEach(button => button.addEventListener("click", () => removeWindow(button.dataset.windowDel)));
      document.querySelector("#export-config").addEventListener("click", downloadConfig);
      document.querySelector("#import-config").addEventListener("change", importConfig);
      document.querySelector("#export-sheet").addEventListener("click", downloadSheet);
      document.querySelector("#import-sheet").addEventListener("change", importSheet);
    }

    async function execute(id, withDependencies) {
      const box = main.querySelector(`[data-msg="${id}"]`);
      const button = main.querySelector(`[data-run="${id}"]`);
      button.disabled = true;
      box.textContent = t("Esecuzione in corso.");
      const response = await fetch("/api/pipelines/" + id + "/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ withDependencies: !!withDependencies })
      });
      const data = await response.json();
      const text = response.ok
        ? (data.silence ? frase(data) : (data.waiting ? t("In attesa di chiamate sul webhook.") : (data.failed ? t("Esecuzione interrotta. Le righe scartate sono in Attività.") : t("Esecuzione terminata. Il dettaglio è nel riquadro."))))
        : (data.error || t("Esecuzione non riuscita."));
      say(text);
      await refresh();
      const again = main.querySelector(`[data-msg="${id}"]`);
      if (again) again.textContent = text;
    }

    async function dry(id) {
      const box = main.querySelector(`[data-msg="${id}"]`);
      box.textContent = t("Prova in corso, senza scrivere su Espo.");
      const response = await fetch("/api/pipelines/" + id + "/dry", { method: "POST" });
      const data = await response.json();
      if (!response.ok) {
        box.textContent = data.error || t("Prova non riuscita.");
        return;
      }
      const rows = data.rows || [];
      const samples = (data.samples || []).map(item => item.from + ": " + (item.values || []).join(" | ")).join(" · ");
      box.textContent = data.detail || (samples ? samples + ". " : "") + (rows.length ? rows.map(row => row.detail ? ("Scartata: " + row.detail) : JSON.stringify(row.mapped || row)).join(" · ") : "Nessuna riga da mostrare.");
    }

    async function previewRun(id) {
      const box = main.querySelector(`[data-msg="${id}"]`);
      box.textContent = t("Anteprima in corso, senza scrivere su Espo.");
      const response = await fetch("/api/pipelines/" + id + "/anteprima", { method: "POST" });
      const data = await response.json();
      if (!response.ok) { box.textContent = data.error || t("Anteprima non riuscita."); return; }
      const dangerous = (data.pericolose || []).map(item => item.field + " da " + item.today + " a " + item.incoming).join("; ");
      box.textContent = (data.detail || "") + (dangerous ? " Righe pericolose: " + dangerous : "");
    }

    async function setReading(id, enabled) {
      await fetch("/api/pipelines/" + id + "/lettura", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled, hours: 48 })
      });
      say(enabled ? t("Modalità lettura per 48 ore. Alla scadenza la scrittura non parte da sola.") : t("Modalità lettura spenta."));
      await refresh();
    }

    async function undoRun(id) {
      const box = main.querySelector(`[data-msg="${id}"]`);
      const response = await fetch("/api/pipelines/" + id + "/annulla", { method: "POST" });
      const data = await response.json();
      box.textContent = response.ok ? t("Ripristinati {n} campi, lasciati {m}.", { n: data.restored, m: data.kept }) : (data.error || t("Annullamento non riuscito."));
    }

    async function confirmCloses(id) {
      const box = main.querySelector(`[data-msg="${id}"]`);
      const response = await fetch("/api/pipelines/" + id + "/chiusure", { method: "POST" });
      const data = await response.json();
      box.textContent = response.ok ? t("Chiuse {n}.", { n: data.closed }) : (data.error || t("Conferma non riuscita."));
      if (response.ok) await refresh();
    }

    async function toggleEnabled(id, enabled) {
      await fetch("/api/pipelines/" + id + "/enabled", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled })
      });
      say(enabled ? t("Integrazione riattivata.") : t("Integrazione in pausa."));
      await refresh();
    }

    async function downloadConfig() {
      const response = await fetch("/api/export");
      const blob = await response.blob();
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "nesso-configurazione.json";
      link.click();
    }

    async function downloadSheet() {
      const response = await fetch("/api/foglio");
      const blob = await response.blob();
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "nesso-abbinamento.csv";
      link.click();
    }

    async function importSheet(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        const response = await fetch("/api/foglio", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: await file.text() })
        });
        const data = await response.json();
        say(response.ok ? t("Foglio caricato.") : (data.error || t("Il foglio non è un abbinamento.")));
      } catch (error) {
        say(t("Il foglio non è un abbinamento."));
      }
      await refresh();
    }

    async function importConfig(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        const body = JSON.parse(await file.text());
        const response = await fetch("/api/import", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const data = await response.json();
        say(response.ok ? t("Configurazione caricata.") : (data.error || t("Caricamento non riuscito.")));
      } catch (error) {
        say(t("Il file non è una configurazione."));
      }
      await refresh();
    }

    function emptyRow() {
      return { from: "", role: "field", to: "", lookupEntity: "", lookupBy: "", transform: "copy", constant: "", valueMap: "", onMiss: "fail", owner: "sorgente" };
    }

    function blankDraft() {
      return { id: "", name: "", connectionId: "", entityMode: "existing", espoEntity: "", newSingular: "", newPlural: "", externalIdField: "", keyColumns: [], scheduleMinutes: "0", scheduleAt: "", expectAt: "", alertMinutes: "", dependsOn: "", cursorColumn: "", enabled: true, onDuplicate: "fail", proposeFrom: "", proposeEntity: "", proposeField: "", proposeValue: "", rows: [emptyRow()], samples: null };
    }

    function draftFromPipeline(item) {
      const rows = (item.mapping || []).map(rule => {
        if (rule.role === "visibility") {
          return { from: "", role: "visibility", to: "visibility", lookupEntity: "", lookupBy: "", transform: "copy", constant: "", valueMap: "", onMiss: rule.onMiss || "skip", owner: "sorgente", teamFrom: rule.lookupEntity === "Team" && !rule.constValue ? rule.from : "", team: rule.constValue || "", assignFrom: rule.lookupEntity === "User" ? rule.from : "" };
        }
        if (rule.transform === "lookups") {
          return { from: rule.from, role: "links", to: String(rule.to || "").replace(/Ids$/, ""), lookupEntity: rule.lookupEntity || "", lookupBy: rule.lookupBy || "", transform: "copy", constant: "", valueMap: "", onMiss: rule.onMiss || "fail" };
        }
        if (rule.parentType || (rule.transform === "lookup" && rule.to === "parentId")) {
          return { from: rule.from, role: "parent", to: rule.parentType || rule.lookupEntity || "", lookupEntity: rule.parentType || rule.lookupEntity || "", lookupBy: rule.lookupBy || "", transform: "copy", constant: "", valueMap: "", onMiss: rule.onMiss || "fail" };
        }
        if (rule.transform === "lookup") {
          return { from: rule.from, role: "link", to: rule.lookupEntity || "", lookupEntity: rule.lookupEntity || "", lookupBy: rule.lookupBy || "", transform: "copy", constant: "", valueMap: "", onMiss: rule.onMiss || "fail" };
        }
        let transform = rule.transform || "copy";
        let constant = "";
        if (String(transform).startsWith("const:")) {
          constant = String(transform).slice(6);
          transform = "const";
        }
        const valueMap = rule.valueMap ? Object.entries(rule.valueMap).map(([key, value]) => key + "=" + value).join("\n") : "";
        return { from: rule.from === "_const" ? "" : rule.from, role: "field", to: rule.to, lookupEntity: "", lookupBy: "", transform, constant, valueMap, onMiss: "fail", owner: rule.owner || "sorgente" };
      });
      return {
        id: item.id,
        name: item.name,
        connectionId: item.connection_id || "",
        entityMode: "existing",
        espoEntity: item.espo_entity,
        newSingular: "",
        newPlural: "",
        externalIdField: item.external_id_field || "",
        keyColumns: (item.keyColumns || []).filter(name => name && name !== item.external_id_field),
        scheduleMinutes: String(item.schedule_minutes || 0),
        scheduleAt: item.schedule_at || "",
        expectAt: item.expect_at || "",
        alertMinutes: item.alert_minutes || "",
        dependsOn: item.depends_on || "",
        cursorColumn: item.cursor_column || "",
        enabled: item.enabled !== 0,
        onDuplicate: item.on_duplicate || "fail",
        proposeFrom: item.propose_from || "",
        proposeEntity: item.propose_entity || "",
        proposeField: item.propose_field || "",
        proposeValue: item.propose_value || "",
        rows: rows.length ? rows : [emptyRow()]
      };
    }

    function wizardBase() {
      return draft && draft.id ? "#/integrazioni/modifica/" + draft.id + "/" : "#/integrazioni/nuova/";
    }

    function wizard(step) {
      if (!draft) draft = blankDraft();
      const stepNumber = Number(step);
      if (![1, 2, 3, 4].includes(stepNumber)) { location.hash = wizardBase() + "1"; return; }
      const titles = ["Nome e collegamento", "Scheda di Espo", "Abbinamento", "Quando eseguirla"];
      const heading = draft.id ? "Modifica integrazione" : "Nuova integrazione";
      shell(heading + ", passo " + stepNumber, `
        <div class="page-header">
          <div class="page-title"><div><p class="step">Passo ${stepNumber} di 4</p><h1>${titles[stepNumber - 1]}</h1></div></div>
        </div>
        <form id="wizard" class="panel" novalidate>
          ${step === 1 ? stepConnection() : step === 2 ? stepEntity() : step === 3 ? stepMap() : stepReview()}
          <p id="form-error" class="error" role="alert"></p>
          <div class="actions">
            ${stepNumber > 1 ? `<button type="button" class="secondary" id="back">Indietro</button>` : `<a class="btn secondary" href="#/integrazioni">Annulla</a>`}
            <button type="submit" ${stepNumber === 4 ? "data-cambia" : ""}>${stepNumber === 4 ? "Salva integrazione" : "Continua"}</button>
          </div>
        </form>
      `);
      const form = document.querySelector("#wizard");
      const back = document.querySelector("#back");
      if (back) back.addEventListener("click", () => { readStep(stepNumber); location.hash = wizardBase() + (stepNumber - 1); });
      if (stepNumber === 2) {
        form.addEventListener("change", () => {
          const mode = form.entityMode.value;
          document.querySelector("#existing-entity").hidden = mode !== "existing";
          document.querySelector("#new-entity").hidden = mode !== "new";
        });
      }
      if (stepNumber === 3 && selectedKind() !== "pdf") {
        bindMap(form);
        if (draft.connectionId) {
          fetch("/api/connections/" + draft.connectionId + "/campione", { method: "POST" })
            .then(response => response.json())
            .then(data => {
              const host = document.querySelector("#campione");
              const rows = data.rows || [];
              if (!host || !rows.length) return;
              const names = Object.keys(rows[0]).slice(0, 6);
              host.textContent = names.map(name => name + ": " + rows.slice(0, 3).map(row => row[name] || "").join(" | ")).join(" · ");
            })
            .catch(() => {});
        }
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = readStep(stepNumber);
        if (error) return showError(error);
        if (stepNumber < 4) { location.hash = wizardBase() + (stepNumber + 1); return; }
        await savePipeline();
      });
    }

    function selectedKind() {
      return (connectionOf(draft.connectionId) || {}).kind;
    }

    function stepConnection() {
      const items = state.connections || [];
      if (!items.length) {
        return `<p>Prima serve un collegamento.</p><p><a href="#/collegamenti/nuovo">Crea un collegamento</a></p>`;
      }
      return `
        <label>Nome dell'integrazione <input name="name" required value="${esc(draft.name)}"></label>
        <label>Collegamento
          <select name="connectionId" required>
            <option value="">Scegli</option>
            ${items.map(item => `<option value="${esc(item.id)}" ${item.id === draft.connectionId ? "selected" : ""}>${esc(item.name)} · ${esc(kindLabel[item.kind])}</option>`).join("")}
          </select>
          <span class="hint">Webhook, database, CSV e PDF portano dati dentro Espo. La destinazione HTTP li porta fuori.</span>
        </label>`;
    }

    function stepEntity() {
      const outbound = selectedKind() === "http";
      const choices = catalog.map(item => `<option value="${esc(item.name)}" ${item.name === draft.espoEntity ? "selected" : ""}>${esc(item.label)}</option>`).join("");
      if (outbound) {
        return `<p>Questi dati escono da Espo verso il sistema esterno.</p>
          <label>Scheda di Espo <select name="espoEntity" required><option value="">Scegli</option>${choices}</select></label>`;
      }
      return `
        <fieldset class="radios">
          <legend>Quale scheda</legend>
          <label><input type="radio" name="entityMode" value="existing" ${draft.entityMode !== "new" ? "checked" : ""}> Una scheda già presente in Espo</label>
          <label><input type="radio" name="entityMode" value="new" ${draft.entityMode === "new" ? "checked" : ""}> Una scheda che ancora non esiste</label>
        </fieldset>
        <div id="existing-entity" ${draft.entityMode === "new" ? "hidden" : ""}>
          <label>Scheda <select name="espoEntity"><option value="">Scegli</option>${choices}</select></label>
        </div>
        <div id="new-entity" ${draft.entityMode === "new" ? "" : "hidden"}>
          <label>Nome singolare <input name="newSingular" value="${esc(draft.newSingular)}" autocomplete="off"><span class="hint">Per esempio Consegna.</span></label>
          <label>Nome plurale <input name="newPlural" value="${esc(draft.newPlural)}" autocomplete="off"><span class="hint">Per esempio Consegne. La scheda viene creata su Espo quando salvi.</span></label>
        </div>`;
    }

    function stepMap() {
      const outbound = selectedKind() === "http";
      if (selectedKind() === "pdf") {
        return `<p>Il nome del file contiene la chiave dell'azienda. Il PDF diventa un documento sul cliente, nella cartella e nel team del collegamento. Un nome senza quella chiave resta in cartella.</p>`;
      }
      const rows = draft.rows.map((row, index) => mapFieldset(row, index, outbound)).join("");
      const columns = ((connectionOf(draft.connectionId) || {}).config || {}).columns || [];
      const list = columns.length ? `<datalist id="colonne">${columns.map(name => `<option value="${esc(name)}"></option>`).join("")}</datalist>` : "";
      const identity = outbound ? "" : `
        ${list}
        <label>Colonna che identifica il record nel sistema esterno
          <input name="externalIdField" value="${esc(draft.externalIdField)}" required autocomplete="off" list="colonne">
          <span class="hint">Lo stesso record, con lo stesso valore, aggiorna la scheda invece di crearne un'altra.</span>
        </label>
        <label>Altre colonne della chiave
          <input name="keyColumns" value="${esc((draft.keyColumns || []).join(", "))}" autocomplete="off">
          <span class="hint">Facoltative, separate da virgola. Per un gruppo: il codice società, oltre al codice cliente. La chiave è la concatenazione. Una colonna sola resta il caso normale.</span>
        </label>
        <p id="chiave-esempio" class="hint"></p>`;
      const tools = outbound ? "" : `<div class="actions" data-cambia><button type="button" class="secondary" id="proponi">Proponi l'abbinamento</button><button type="button" class="secondary" data-ricetta="anagrafiche">Ricetta anagrafiche</button><button type="button" class="secondary" data-ricetta="contatti">Ricetta contatti</button><button type="button" class="secondary" data-ricetta="sedi">Ricetta sedi</button><button type="button" class="secondary" data-ricetta="listino">Ricetta listino</button></div><p class="hint">Non è un connettore certificato con un gestionale. È un abbinamento pronto da rivedere.</p>`;
      return `${identity}${tools}<div id="campione" class="hint"></div><div id="map-rows">${rows}</div><button type="button" class="secondary" id="add-row">Aggiungi un abbinamento</button>`;
    }

    function mapFieldset(row, index, outbound) {
      if (outbound) {
        return `<fieldset data-row>
          <legend>Abbinamento ${index + 1}</legend>
          <label>Campo di Espo <select class="espo"><option value="">Scegli</option>${options(fieldChoices(draft.espoEntity, false), "name", "label", row.from)}</select></label>
          <label>Nome che riceve il sistema esterno <input class="ext" value="${esc(row.to)}" autocomplete="off"></label>
          <button type="button" class="secondary remove">Togli questo abbinamento</button>
        </fieldset>`;
      }
      const role = row.role || "field";
      const fieldBlock = draft.entityMode === "new"
        ? `<label>Nome del campo nuovo <input class="field-label" value="${esc(row.to)}" autocomplete="off"></label>`
        : `<label>Campo di Espo <select class="espo"><option value="">Scegli</option>${options(fieldChoices(draft.espoEntity, false), "name", "label", row.to)}</select></label>`;
      const foreign = catalog.filter(item => item.name !== draft.espoEntity);
      const foreignName = row.lookupEntity || (foreign[0] && foreign[0].name);
      const multi = multiLinks(draft.espoEntity, row.lookupEntity);
      return `<fieldset data-row>
        <legend>Abbinamento ${index + 1}</legend>
        <label>Colonna del sistema esterno <input class="ext" value="${esc(row.from)}" autocomplete="off" list="colonne"></label>
        ${row.sample ? `<span class="hint">${esc(t("Come verrebbe letta"))}: ${esc(row.reading && row.reading !== row.sample ? row.sample + " → " + row.reading : row.sample)}</span>` : ""}
        <fieldset class="radios">
          <legend>Che cosa ne facciamo</legend>
          <label><input type="radio" class="role" name="role-${index}" value="field" ${role === "field" ? "checked" : ""}> Lo scriviamo in un campo</label>
          <label><input type="radio" class="role" name="role-${index}" value="link" ${role === "link" ? "checked" : ""}> Colleghiamo una scheda</label>
          <label><input type="radio" class="role" name="role-${index}" value="links" ${role === "links" ? "checked" : ""}> Colleghiamo più record</label>
          <label><input type="radio" class="role" name="role-${index}" value="parent" ${role === "parent" ? "checked" : ""}> È un'attività appesa a una scheda</label>
          <label><input type="radio" class="role" name="role-${index}" value="visibility" ${role === "visibility" ? "checked" : ""}> Questa riga è di un team e di una persona</label>
        </fieldset>
        <div class="as-field" ${role === "field" ? "" : "hidden"}>${fieldBlock}
          ${draft.entityMode === "new" ? "" : `<label>Trasformazione
            <select class="transform">
              <option value="copy" ${(row.transform || "copy") === "copy" ? "selected" : ""}>Copia il valore</option>
              <option value="split_first" ${row.transform === "split_first" ? "selected" : ""}>Prima parola</option>
              <option value="split_last" ${row.transform === "split_last" ? "selected" : ""}>Resto del testo</option>
              <option value="const" ${row.transform === "const" ? "selected" : ""}>Valore fisso</option>
              <option value="map" ${row.transform === "map" ? "selected" : ""}>Mappa dei valori</option>
            </select>
          </label>
          <label>Padrone del campo
            <select class="owner">
              <option value="sorgente" ${(row.owner || "sorgente") === "sorgente" ? "selected" : ""}>La sorgente, anche se la cella è vuota</option>
              <option value="espo" ${row.owner === "espo" ? "selected" : ""}>Espo: un valore diverso finisce in coda</option>
            </select>
          </label>
          <label class="as-const" ${row.transform === "const" ? "" : "hidden"}>Valore fisso <input class="constant" value="${esc(row.constant || "")}" autocomplete="off"></label>
          <label class="as-map" ${row.transform === "map" ? "" : "hidden"}>Valori, uno per riga, esterno=Espo
            <textarea class="value-map">${esc(row.valueMap || "")}</textarea>
            <span class="hint">La riga *=Altro vale per i valori non elencati. Un telefono italiano viene messo in forma internazionale.</span>
          </label>`}
        </div>
        <div class="as-link" ${role === "link" || role === "parent" ? "" : "hidden"}>
          <label>Scheda da collegare <select class="foreign">${options(foreign, "name", "label", row.lookupEntity)}</select></label>
          <label>Campo con cui riconosciamo il record <select class="lookupBy">${options(fieldChoices(foreignName, false), "name", "label", row.lookupBy)}</select></label>
        </div>
        <div class="as-links" ${role === "links" ? "" : "hidden"}>
          <label>Scheda da collegare <select class="foreign">${options(foreign, "name", "label", row.lookupEntity)}</select></label>
          <label>Collegamento sulla scheda <select class="multi">${options(multi, "name", "label", row.to)}</select></label>
          <label>Campo con cui riconosciamo ogni record <select class="lookupBy">${options(fieldChoices(foreignName, false), "name", "label", row.lookupBy)}</select></label>
          <span class="hint">Nella cella possono esserci più valori, separati da virgola.</span>
        </div>
        <div class="as-visibility" ${role === "visibility" ? "" : "hidden"}>
          <label>Colonna del team <input class="team-from" value="${esc(row.teamFrom || "")}" autocomplete="off" list="colonne"></label>
          <label>Oppure team fisso <input class="team-const" value="${esc(row.team || "")}" autocomplete="off"></label>
          <label>Colonna della persona <input class="assign-from" value="${esc(row.assignFrom || "")}" autocomplete="off" list="colonne"></label>
          <span class="hint">La persona si cerca fra gli utenti già in Espo. Non ne nasce una nuova.</span>
        </div>
        <label class="as-miss" ${role === "field" ? "hidden" : ""}>Se il record collegato non c'è
          <select class="on-miss">
            <option value="fail" ${(row.onMiss || "fail") === "fail" ? "selected" : ""}>Scarta la riga</option>
            <option value="skip" ${row.onMiss === "skip" ? "selected" : ""}>Lascia il legame vuoto</option>
            <option value="create" ${row.onMiss === "create" ? "selected" : ""}>Crea il record</option>
          </select>
        </label>
        <button type="button" class="secondary remove">Togli questo abbinamento</button>
      </fieldset>`;
    }

    function bindMap(form) {
      const outbound = selectedKind() === "http";
      const paint = (keepDraft) => {
        if (!keepDraft) readStep(3);
        document.querySelector("#map-rows").innerHTML = draft.rows.map((row, index) => mapFieldset(row, index, outbound)).join("");
        translateTree(document.querySelector("#map-rows"));
        hook();
      };
      const hook = () => {
        form.querySelectorAll("[data-row]").forEach(row => {
          const role = row.querySelector(".role");
          if (role) row.querySelectorAll(".role").forEach(input => input.addEventListener("change", () => paint(false)));
          row.querySelectorAll(".transform").forEach(input => input.addEventListener("change", () => paint(false)));
          row.querySelectorAll(".foreign").forEach(foreign => foreign.addEventListener("change", () => paint(false)));
          const remove = row.querySelector(".remove");
          remove.addEventListener("click", () => {
            readStep(3);
            const index = [...form.querySelectorAll("[data-row]")].indexOf(row);
            draft.rows.splice(index, 1);
            if (!draft.rows.length) draft.rows.push(emptyRow());
            paint(true);
          });
        });
      };
      hook();
      document.querySelector("#add-row").addEventListener("click", () => {
        readStep(3);
        draft.rows.push(emptyRow());
        paint(true);
      });
      const proponi = document.querySelector("#proponi");
      if (proponi) proponi.addEventListener("click", () => proposeMapping(paint));
      form.querySelectorAll("[data-ricetta]").forEach(button => {
        button.addEventListener("click", () => applyRecipe(button.dataset.ricetta, paint));
      });
      const extra = form.querySelector("[name=keyColumns]");
      const identity = form.querySelector("[name=externalIdField]");
      const refreshExample = () => { readStep(3); paintKeyExample(); };
      if (extra) extra.addEventListener("input", refreshExample);
      if (identity) identity.addEventListener("input", refreshExample);
      if (draft.connectionId && !(draft.samples || []).length) {
        fetch("/api/connections/" + encodeURIComponent(draft.connectionId) + "/campione", { method: "POST" })
          .then(response => response.json())
          .then(data => { draft.samples = data.rows || []; paintKeyExample(); })
          .catch(() => {});
      } else paintKeyExample();
    }

    function paintKeyExample() {
      const box = document.querySelector("#chiave-esempio");
      if (!box) return;
      const columns = [draft.externalIdField, ...(draft.keyColumns || [])].filter(Boolean);
      const rows = draft.samples || [];
      if (columns.length < 2 || !rows.length) { box.textContent = ""; return; }
      const values = [];
      rows.forEach(row => {
        if (values.length >= 3) return;
        const parts = columns.map(name => String(row[name] ?? "").trim());
        if (parts.some(part => !part || part.includes("|"))) return;
        values.push(parts.join("|"));
      });
      box.textContent = values.length ? t("Chiave composta") + ": " + values.join(", ") : "";
    }

    function catalogFields(entityName) {
      return fieldChoices(entityName, false).map(field => ({ name: field.name, label: field.label }));
    }

    async function proposeMapping(paint) {
      readStep(3);
      let samples = draft.samples || [];
      if (!samples.length && draft.connectionId) {
        const response = await fetch("/api/connections/" + draft.connectionId + "/campione", { method: "POST" });
        const data = await response.json();
        samples = data.rows || [];
        draft.samples = samples;
      }
      const stored = ((connectionOf(draft.connectionId) || {}).config || {}).columns || [];
      const columns = stored.length ? stored : (samples.length ? Object.keys(samples[0]) : draft.rows.map(row => row.from).filter(Boolean));
      const response = await fetch("/api/proponi", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ columns, fields: catalogFields(draft.espoEntity), samples })
      });
      const data = await response.json();
      if (!response.ok) return showError(data.error || "Non sono riuscito a salvare.");
      const identity = (data.rows || []).find(row => row.role === "identity" && row.known);
      if (identity) draft.externalIdField = identity.from;
      const mapped = (data.rows || []).filter(row => row.role !== "identity").map(row => ({
        ...emptyRow(),
        from: row.from,
        to: row.to || "",
        sample: row.sample || "",
        reading: row.reading || ""
      }));
      draft.rows = mapped.length ? mapped : [emptyRow()];
      paint(true);
      const identityInput = document.querySelector("[name=externalIdField]");
      if (identityInput) identityInput.value = draft.externalIdField || "";
      say(t("Proposta applicata. Non è stata scritta finché non salvi."));
    }

    async function applyRecipe(id, paint) {
      const response = await fetch("/api/ricette/" + encodeURIComponent(id), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fields: catalogFields(id === "contatti" ? "Contact" : (id === "listino" ? "Product" : "Account")) })
      });
      const data = await response.json();
      if (!response.ok) return showError(data.error || "Non sono riuscito a salvare.");
      draft.entityMode = "existing";
      draft.espoEntity = data.entity;
      draft.externalIdField = data.externalIdField;
      draft.keyColumns = [];
      draft.rows = (data.rows || []).map(row => ({
        ...emptyRow(),
        from: row.from,
        to: row.to || "",
        kind: row.kind || "",
        role: row.role || "field",
        lookupEntity: row.lookupEntity || "",
        lookupBy: row.lookupBy || "",
        onMiss: row.onMiss || "fail"
      }));
      paint(true);
      const identityInput = document.querySelector("[name=externalIdField]");
      if (identityInput) identityInput.value = draft.externalIdField || "";
      const extra = document.querySelector("[name=keyColumns]");
      if (extra) extra.value = "";
      say(t(data.noteKey || "Ricetta applicata. Rivedi l'abbinamento prima di salvare."));
    }

    function stepReview() {
      const link = connectionOf(draft.connectionId);
      const outbound = selectedKind() === "http";
      const entityLabel = draft.entityMode === "new" && !outbound ? draft.newSingular : ((entityOf(draft.espoEntity) || {}).label || draft.espoEntity);
      const when = { "0": "Solo a comando, oppure all'arrivo di un webhook", "5": "Ogni 5 minuti", "15": "Ogni 15 minuti", "60": "Ogni ora" };
      return `
        <p>Controlla. Se salvi, la scheda nuova e i collegamenti interni vengono creati su Espo.</p>
        <dl>
          <dt>Nome</dt><dd>${esc(draft.name)}</dd>
          <dt>Collegamento</dt><dd>${esc(link ? link.name : "")}</dd>
          <dt>Scheda</dt><dd>${esc(entityLabel)}</dd>
          ${outbound ? "" : `<dt>Identità</dt><dd>${esc([draft.externalIdField, ...(draft.keyColumns || [])].filter(Boolean).join(" | "))}</dd>`}
          <dt>Abbinamenti</dt><dd>${draft.rows.length}</dd>
        </dl>
        <label>Orario fisso, facoltativo
          <input name="scheduleAt" value="${esc(draft.scheduleAt || "")}" placeholder="02:10" autocomplete="off">
          <span class="hint">Se lo scrivi, il giro parte una volta al giorno a quell'ora. Esempio 02:10.</span>
        </label>
        <label>File atteso entro, facoltativo
          <input name="expectAt" value="${esc(draft.expectAt || "")}" placeholder="07:00" autocomplete="off">
          <span class="hint">Per un file. Se a quell'ora non è stato elaborato, la home diventa rossa. Esempio 07:00.</span>
        </label>
        <label>Avvisa se tace da più di, minuti
          <input name="alertMinutes" value="${esc(draft.alertMinutes || "")}" inputmode="numeric" autocomplete="off">
          <span class="hint">Se lo lasci vuoto, il silenzio non accende un avviso. Un giro fallito avvisa comunque, una volta.</span>
        </label>
        <label>Quando
          <select name="scheduleMinutes">
            ${Object.entries(when).map(([value, label]) => `<option value="${value}" ${String(draft.scheduleMinutes) === value ? "selected" : ""}>${label}</option>`).join("")}
          </select>
        </label>
        <label>Prima esegui
          <select name="dependsOn">
            <option value="">Nessuna</option>
            ${(state.pipelines || []).filter(item => item.id !== draft.id).map(item => `<option value="${esc(item.id)}" ${item.id === draft.dependsOn ? "selected" : ""}>${esc(item.name)}</option>`).join("")}
          </select>
          <span class="hint">Quando lanci questa, parte prima l'altra. Il pianificatore la rilancia solo se è di nuovo ora.</span>
        </label>
        ${outbound ? "" : `<label>Colonna di variazione, facoltativa
          <input name="cursorColumn" value="${esc(draft.cursorColumn || "")}" list="colonne" autocomplete="off">
          <span class="hint">Se la indichi, il database non viene riletto tutto: si riparte dall'ultimo valore. Vale per MySQL e MariaDB.</span>
        </label>
        <label>Se Espo ha già un record simile
          <select name="onDuplicate">
            <option value="fail" ${draft.onDuplicate !== "adopt" ? "selected" : ""}>Scarta la riga</option>
            <option value="adopt" ${draft.onDuplicate === "adopt" ? "selected" : ""}>Aggiorna quel record e mettici la nostra chiave</option>
          </select>
        </label>`}
        <label><input type="checkbox" name="enabled" ${draft.enabled === false ? "" : "checked"}> Integrazione attiva</label>
        ${outbound ? "" : `<label>Colonna dell'offerta, facoltativa
          <input name="proposeFrom" value="${esc(draft.proposeFrom || "")}" autocomplete="off">
          <span class="hint">Se la riga è un ordine, qui c'è la chiave dell'offerta. La fase non cambia finché non la confermi in Attività.</span>
        </label>
        <label>Scheda dell'offerta
          <input name="proposeEntity" value="${esc(draft.proposeEntity || "")}" autocomplete="off" placeholder="Opportunity">
        </label>
        <label>Campo della fase
          <input name="proposeField" value="${esc(draft.proposeField || "")}" autocomplete="off" placeholder="stage">
        </label>
        <label>Valore proposto
          <input name="proposeValue" value="${esc(draft.proposeValue || "")}" autocomplete="off" placeholder="Closed Won">
        </label>`}`;
    }

    function readStep(step) {
      const form = document.querySelector("#wizard");
      if (!form) return "";
      if (step === 1) {
        if (!form.name) return "Prima crea un collegamento.";
        draft.name = form.name.value.trim();
        draft.connectionId = form.connectionId.value;
        if (!draft.name) return "Scrivi il nome dell'integrazione.";
        if (!draft.connectionId) return "Scegli un collegamento.";
      }
      if (step === 2) {
        const outbound = selectedKind() === "http";
        if (outbound) {
          draft.entityMode = "existing";
          draft.espoEntity = form.espoEntity.value;
          if (!draft.espoEntity) return "Scegli la scheda di Espo.";
        } else {
          draft.entityMode = form.entityMode.value;
          if (draft.entityMode === "new") {
            draft.newSingular = form.newSingular.value.trim();
            draft.newPlural = form.newPlural.value.trim();
            draft.espoEntity = "__new__";
            if (!draft.newSingular || !draft.newPlural) return "Scrivi il nome singolare e il nome plurale.";
          } else {
            draft.espoEntity = form.espoEntity.value;
            if (!draft.espoEntity) return "Scegli la scheda di Espo.";
          }
        }
      }
      if (step === 3) {
        if (selectedKind() === "pdf") {
          draft.externalIdField = draft.externalIdField || "nome";
          draft.rows = [{ ...emptyRow(), from: "nome", to: "name" }];
          return "";
        }
        const outbound = selectedKind() === "http";
        if (!outbound && form.externalIdField) draft.externalIdField = form.externalIdField.value.trim();
        if (!outbound && form.keyColumns) {
          draft.keyColumns = form.keyColumns.value.split(",").map(name => name.trim()).filter(name => name && name !== draft.externalIdField);
        }
        draft.rows = [...form.querySelectorAll("[data-row]")].map(row => {
          const roleInput = row.querySelector(".role:checked");
          const role = roleInput ? roleInput.value : "field";
          const ext = row.querySelector(".ext");
          if (outbound) return { ...emptyRow(), from: row.querySelector(".espo").value, role: "field", to: ext.value.trim() };
          const typed = row.querySelector(".field-label");
          const chosen = row.querySelector(".espo");
          const box = role === "links" ? row.querySelector(".as-links") : row.querySelector(".as-link");
          const foreignSelect = box ? box.querySelector(".foreign") : null;
          const lookupSelect = box ? box.querySelector(".lookupBy") : null;
          const multi = row.querySelector(".as-links .multi");
          const transform = row.querySelector(".transform");
          const miss = row.querySelector(".on-miss");
          let to = typed ? typed.value.trim() : (chosen ? chosen.value : "");
          if (role === "link" || role === "parent") to = foreignSelect ? foreignSelect.value : "";
          if (role === "links") to = multi ? multi.value : "";
          if (role === "visibility") {
            return {
              from: (row.querySelector(".team-from") || {}).value || (row.querySelector(".assign-from") || {}).value || "team",
              role: "visibility",
              to: "visibility",
              teamFrom: row.querySelector(".team-from") ? row.querySelector(".team-from").value.trim() : "",
              team: row.querySelector(".team-const") ? row.querySelector(".team-const").value.trim() : "",
              assignFrom: row.querySelector(".assign-from") ? row.querySelector(".assign-from").value.trim() : "",
              lookupEntity: "",
              lookupBy: "",
              transform: "copy",
              constant: "",
              valueMap: "",
              onMiss: miss ? miss.value : "skip",
              owner: "sorgente"
            };
          }
          return {
            from: ext.value.trim(),
            role,
            to,
            lookupEntity: foreignSelect ? foreignSelect.value : "",
            lookupBy: lookupSelect ? lookupSelect.value : "",
            transform: transform ? transform.value : "copy",
            constant: (row.querySelector(".constant") || {}).value ? row.querySelector(".constant").value.trim() : "",
            valueMap: (row.querySelector(".value-map") || {}).value || "",
            onMiss: miss ? miss.value : "fail",
            owner: (row.querySelector(".owner") || {}).value || "sorgente"
          };
        });
        if (!outbound && !draft.externalIdField) return "Indica la colonna che identifica il record.";
        if (!draft.rows.some(row => row.from && row.to)) return "Compila almeno un abbinamento.";
      }
      if (step === 4 && form.scheduleMinutes) {
        draft.scheduleMinutes = form.scheduleMinutes.value;
        draft.dependsOn = form.dependsOn.value;
        draft.cursorColumn = form.cursorColumn ? form.cursorColumn.value.trim() : "";
        draft.onDuplicate = form.onDuplicate ? form.onDuplicate.value : "fail";
        draft.enabled = form.enabled.checked;
        draft.scheduleAt = form.scheduleAt ? form.scheduleAt.value.trim() : "";
        draft.expectAt = form.expectAt ? form.expectAt.value.trim() : "";
        draft.alertMinutes = form.alertMinutes ? form.alertMinutes.value.trim() : "";
        if (form.proposeFrom) {
          draft.proposeFrom = form.proposeFrom.value.trim();
          draft.proposeEntity = form.proposeEntity.value.trim();
          draft.proposeField = form.proposeField.value.trim();
          draft.proposeValue = form.proposeValue.value.trim();
        }
      }
      return "";
    }

    function parseValueMap(text) {
      const table = {};
      String(text || "").split(/\r?\n/).forEach(line => {
        const clean = line.trim();
        if (!clean || !clean.includes("=")) return;
        const cut = clean.indexOf("=");
        table[clean.slice(0, cut).trim()] = clean.slice(cut + 1).trim();
      });
      return table;
    }

    async function savePipeline() {
      const outbound = selectedKind() === "http";
      const mapping = draft.rows.filter(row => row.role === "visibility" || ((row.from || row.transform === "const") && row.to)).map(row => {
        if (row.role === "visibility") {
          return { role: "visibility", from: row.teamFrom || row.assignFrom || "team", teamFrom: row.teamFrom || "", team: row.team || "", assignFrom: row.assignFrom || "", onMiss: row.onMiss === "create" ? "skip" : (row.onMiss || "skip") };
        }
        if (outbound) return { from: row.from, to: row.to, role: "field" };
        const transform = row.transform === "const" ? "const:" + (row.constant || "") : (row.transform || "copy");
        const valueMap = row.transform === "map" ? parseValueMap(row.valueMap) : undefined;
        if (row.role === "link" || row.role === "parent") {
          return { from: row.from, to: row.lookupEntity, role: row.role, lookupEntity: row.lookupEntity, lookupBy: row.lookupBy, onMiss: row.onMiss || "fail" };
        }
        if (row.role === "links") {
          return { from: row.from, to: row.to, role: "links", lookupEntity: row.lookupEntity, lookupBy: row.lookupBy, onMiss: row.onMiss || "fail" };
        }
        return { from: row.from, to: row.to, role: "field", transform, valueMap, owner: row.owner || "sorgente" };
      });
      const body = {
        id: draft.id || undefined,
        name: draft.name,
        connectionId: draft.connectionId,
        direction: outbound ? "out" : "in",
        espoEntity: outbound ? draft.espoEntity : (draft.entityMode === "new" ? "__new__" : draft.espoEntity),
        newSingular: draft.newSingular,
        newPlural: draft.newPlural,
        externalIdField: draft.externalIdField,
        keyColumns: [draft.externalIdField, ...(draft.keyColumns || [])].filter(Boolean),
        scheduleMinutes: Number(draft.scheduleMinutes),
        scheduleAt: draft.scheduleAt || "",
        expectAt: draft.expectAt || "",
        alertMinutes: draft.alertMinutes || "",
        dependsOn: draft.dependsOn,
        cursorColumn: draft.cursorColumn,
        enabled: draft.enabled !== false,
        onDuplicate: draft.onDuplicate || "fail",
        proposeFrom: draft.proposeFrom || "",
        proposeEntity: draft.proposeEntity || "",
        proposeField: draft.proposeField || "",
        proposeValue: draft.proposeValue || "",
        mapping
      };
      const button = document.querySelector("#wizard button[type=submit]");
      button.disabled = true;
      const response = await fetch("/api/pipelines", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await response.json();
      button.disabled = false;
      if (!response.ok) return showError(data.error || t("Non sono riuscito a salvare."));
      draft = null;
      say(t("Integrazione salvata."));
      catalog = [];
      location.hash = "#/integrazioni";
    }

      const inbound = (state.queue || []).map(item => `<tr><td>${esc(names[item.pipeline_id] || item.pipeline_id)}</td><td>${esc(item.external_id)}</td><td>${esc(phrases[item.detail] || item.detail || item.status)}</td><td>${esc(item.updated_at)}</td></tr>`);
      const outbound = (state.deliveries || []).map(item => `<tr><td>${esc(names[item.pipeline_id] || item.connection_id || "")}</td><td>Uscita</td><td>${esc(phrases[item.status] || item.status)}${item.detail ? " — " + esc(item.detail) : ""}</td><td>${esc(item.created_at)}</td></tr>`);

            <tbody>${(state.watch || []).map(item => `<tr><td>${esc(names[item.pipeline_id] || item.pipeline_id)}</td><td>${esc(item.external_id || "")}</td><td>${esc(item.field_name)}</td><td>${esc(item.current_value || "")} → ${esc(item.incoming_value || "")} <button type="button" class="secondary" data-keep="espo" data-watch="${item.id}">Tieni Espo</button> <button type="button" data-keep="sorgente" data-watch="${item.id}">Prendi la sorgente</button></td></tr>`).join("") || `<tr><td colspan="4">Nessun contrasto.</td></tr>`}</tbody>
          </table>
        </div>
        <div class="panel">
