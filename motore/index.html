        </form>
      `);
      main.querySelectorAll("[data-watch]").forEach(button => button.addEventListener("click", async () => {
        const response = await fetch("/api/watch/" + button.dataset.watch, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ keep: button.dataset.keep })
        });
        const data = await response.json();
        say(response.ok ? t("Scelta registrata.") : (data.error || t("Scelta non riuscita.")));
        if (response.ok) await refresh();
      }));
      const decide = async (id, action) => {
        const response = await fetch("/api/proposte/" + id + "/" + action, { method: "POST" });
        const data = await response.json();
        say(response.ok ? t(action === "conferma" ? "Fase confermata." : "Fase lasciata com'era.") : (data.error || t("Scelta non riuscita.")));
        if (response.ok) await refresh();
      };
      main.querySelectorAll("[data-propose-ok]").forEach(button => button.addEventListener("click", () => decide(button.dataset.proposeOk, "conferma")));
      main.querySelectorAll("[data-propose-drop]").forEach(button => button.addEventListener("click", () => decide(button.dataset.proposeDrop, "lascia")));
      document.querySelector("#privacy").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.target;
        const response = await fetch("/api/privacy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contact: form.contact.value.trim(), company: form.company.value.trim() })
        });
        const data = await response.json();
        if (!response.ok) return say(data.error || t("Esportazione non riuscita."));
        const lines = ["quando;scheda;chiave;campo;valore"].concat((data.rows || []).map(row => [row.at, row.entity, row.key, row.field, row.value].map(value => `"${String(value ?? "").replaceAll('"', '""')}"`).join(";")));
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" }));
        link.download = "nesso-persona.csv";
        link.click();
        say(t("File pronto. I record restano dov'erano."));
      });
    }

    function notFound() {
      shell("Pagina non trovata", `<div class="page-header"><h1>Pagina non trovata</h1></div><p><a href="#/">Torna all'inizio</a></p>`);
    }

    function bindDelete() {
      main.querySelectorAll("[data-del-c], [data-del-p]").forEach(button => {
        button.addEventListener("click", () => {
          const connection = button.dataset.delC;
          document.querySelector("#conferma-titolo").textContent = connection ? t("Eliminare questo collegamento?") : t("Eliminare questa integrazione?");
          document.querySelector("#conferma-testo").textContent = button.dataset.name + (connection ? t(". Le integrazioni che lo usano restano, senza canale.") : t(". I record già scritti su Espo restano."));
          dialog.showModal();
          document.querySelector("#conferma-si").onclick = async () => {
            const url = connection ? "/api/connections/" + connection : "/api/pipelines/" + button.dataset.delP;
            await fetch(url, { method: "DELETE" });
            dialog.close();
            say(t("Eliminato."));
            await refresh();
          };
        });
      });
    }
    document.querySelector("#conferma-no").addEventListener("click", () => dialog.close());
    document.querySelector("#nav-min").addEventListener("click", () => {
      document.body.classList.toggle("nav-min");
      localStorage.setItem("nesso-nav", document.body.classList.contains("nav-min") ? "min" : "full");
    });
    document.querySelector("#menu-toggle").addEventListener("click", () => document.body.classList.toggle("nav-open"));
    if (localStorage.getItem("nesso-nav") === "min") document.body.classList.add("nav-min");

    const fieldTypes = [
      ["varchar", "Testo"],
      ["text", "Testo lungo"],
      ["int", "Numero intero"],
      ["float", "Numero"],
      ["date", "Data"],
      ["datetime", "Data e ora"],
      ["bool", "Sì/no"],
      ["enum", "Elenco"],
      ["currency", "Valuta"],
      ["email", "Email"],
      ["phone", "Telefono"],
      ["url", "Indirizzo web"]
    ];
    function typeLabel(type) {
      const found = fieldTypes.find(item => item[0] === type);
      return found ? found[1] : type;
    }
    function pipelinesOf(entityName) {
      return (state.pipelines || []).filter(item => item.espo_entity === entityName || item.espoEntity === entityName);
    }

    function sheetsPage() {
      const rows = catalog.map(entity => {
        const uses = pipelinesOf(entity.name);
        return `<tr>
          <td><a href="#/schede/${esc(entity.name)}">${esc(entity.label)}</a></td>
          <td><code>${esc(entity.name)}</code></td>
          <td>${uses.length ? uses.map(item => esc(item.name)).join(", ") : "nessuna"}</td>
        </tr>`;
      }).join("");
      shell("Schede", `
        <div class="page-header">
          <div class="page-title"><h1>Schede</h1></div>
          <div class="header-buttons"><a class="btn" data-cambia href="#/schede/nuova">Nuova scheda</a></div>
        </div>
        <p class="lead">Qui si vede che cosa c'è in Espo e quali integrazioni lo toccano. Una scheda nuova, e i suoi campi, si aggiungono da qui.</p>
        <div class="table-wrap panel">
          <table>
            <caption>Schede di Espo</caption>
            <thead><tr><th>Nome</th><th>Nome tecnico</th><th>Integrazioni</th></tr></thead>
            <tbody>${rows || `<tr><td colspan="3">Nessuna scheda ancora.</td></tr>`}</tbody>
          </table>
        </div>
      `);
    }

    function newSheetPage() {
      shell("Nuova scheda", `
        <div class="page-header">
          <div class="page-title"><h1>Nuova scheda</h1></div>
          <div class="header-buttons"><a class="btn secondary" href="#/schede">Annulla</a></div>
        </div>
        <form class="panel" id="sheet-form">
          <p id="form-error" class="error" role="alert"></p>
          <label>Nome singolare<input name="singular" required maxlength="60" placeholder="Consegna"></label>
          <label>Nome plurale<input name="plural" required maxlength="60" placeholder="Consegne"></label>
          <p class="hint">Espo antepone C al nome tecnico. Consegna diventa CConsegna. Nasce anche la chiave esterna.</p>
          <div class="actions"><button type="submit">Crea la scheda</button></div>
        </form>
      `);
      document.querySelector("#sheet-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const response = await fetch("/api/sheets", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ singular: form.singular.value.trim(), plural: form.plural.value.trim() })
        });
        const data = await response.json();
        if (!response.ok) return showError(data.error || "Non sono riuscito a creare la scheda.");
        catalog.push({
          name: data.name,
          label: form.singular.value.trim(),
          keyField: "externalKey",
          fields: [
            { name: "name", label: "Nome", type: "varchar" },
            { name: "externalKey", label: "Chiave esterna", type: "varchar" }
          ]
        });
        catalog.sort((a, b) => a.label.localeCompare(b.label, "it"));
        location.hash = "#/schede/" + data.name;
      });
    }

    function sheetPage(entityName) {
      const entity = catalog.find(item => item.name === entityName);
      if (!entity) return notFound();
      const uses = pipelinesOf(entity.name);
      const fields = entity.fields.map(field => `<tr>
        <td>${esc(field.label)}</td>
        <td>${esc(typeLabel(field.type))}</td>
        <td><code>${esc(field.name)}</code></td>
      </tr>`).join("");
      const typeOptions = fieldTypes.map(([value, label]) => `<option value="${value}">${label}</option>`).join("");
      shell(entity.label, `
        <div class="page-header">
          <div class="page-title"><h1>${esc(entity.label)}</h1></div>
          <div class="header-buttons"><a class="btn secondary" href="#/schede">Tutte le schede</a></div>
        </div>
        <p class="lead">Nome tecnico <code>${esc(entity.name)}</code>. ${uses.length ? "Toccata da " + uses.map(item => esc(item.name)).join(", ") + "." : "Nessuna integrazione la tocca."}</p>
        <div class="table-wrap panel">
          <table>
            <caption>Campi</caption>
            <thead><tr><th>Etichetta</th><th>Tipo</th><th>Nome tecnico</th></tr></thead>
            <tbody>${fields || `<tr><td colspan="3">Nessun campo scrivibile.</td></tr>`}</tbody>
          </table>
        </div>
        <form class="panel" id="field-form">
          <h2>Nuovo campo</h2>
          <p id="form-error" class="error" role="alert"></p>
          <label>Etichetta<input name="label" required maxlength="80" placeholder="Data di chiusura"></label>
          <label>Tipo<select name="type">${typeOptions}</select></label>
          <label id="options-label">Valori dell'elenco, uno per riga<textarea name="options" placeholder="Aperta&#10;Chiusa"></textarea></label>
          <label class="radios"><span><input type="checkbox" name="required"> Campo obbligatorio</span></label>
          <div class="actions"><button type="submit">Aggiungi il campo</button></div>
        </form>
      `);
      const optionsLabel = document.querySelector("#options-label");
      const typeSelect = document.querySelector("#field-form select[name=type]");
      const toggleOptions = () => { optionsLabel.hidden = typeSelect.value !== "enum"; };
      typeSelect.addEventListener("change", toggleOptions);
      toggleOptions();
      document.querySelector("#field-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const response = await fetch("/api/sheets/" + encodeURIComponent(entity.name) + "/fields", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            label: form.label.value.trim(),
            type: form.type.value,
            options: form.options.value,
            required: form.required.checked
          })
        });
        const data = await response.json();
        if (!response.ok) return showError(data.error || "Non sono riuscito ad aggiungere il campo.");
        entity.fields.push({ name: data.name, label: form.label.value.trim(), type: form.type.value });
        entity.fields.sort((a, b) => a.label.localeCompare(b.label, "it"));
        render();
      });
    }

    function whenLabel(item) {
      if (!item.enabled) return t("In pausa");
      if (item.readOnly) return t("Modalità lettura");
      if (item.scheduleAt) return t("Ogni giorno alle {ora}", { ora: item.scheduleAt });
      if (item.scheduleMinutes) return t("Ogni {minuti} minuti", { minuti: item.scheduleMinutes });
      return t("Solo a comando, oppure all'arrivo di un webhook");
    }

    function paintConsegna(data) {
      if (pathOf() !== "/consegna") return;
      const direction = { in: "I dati entrano in Espo", out: "I dati escono da Espo" };
      const ownerWord = { sorgente: "La sorgente", espo: "Espo" };
      const blocks = (data.integrations || []).map(item => {
        const owners = (item.owners || []).map(row => `<tr><td>${esc(row.from)}</td><td>${esc(row.to)}</td><td>${esc(t(ownerWord[row.owner] || row.owner))}</td></tr>`).join("");
        return `<section class="panel">
          <h2>${esc(item.name)}</h2>
          <dl>
            <dt>Scheda</dt><dd>${esc(item.entity)}</dd>
            <dt>Verso</dt><dd>${esc(t(direction[item.direction] || item.direction))}</dd>
            <dt>Collegamento</dt><dd>${esc(item.connection || t("Nessuno"))}</dd>
            <dt>Quando</dt><dd>${esc(whenLabel(item))}</dd>
          </dl>
          ${owners ? `<h3>Padrone dei campi</h3><table><thead><tr><th>Colonna</th><th>Campo</th><th>Padrone</th></tr></thead><tbody>${owners}</tbody></table>` : ""}
        </section>`;
      }).join("") || `<p class="panel">Nessuna integrazione.</p>`;
      const windows = (data.silence || []).map(item => `<li>${esc(item.start)} – ${esc(item.end)}${item.reason ? ": " + esc(item.reason) : ""}</li>`).join("");
      shell("Consegna", `
        <div class="page-header">
          <h1>Consegna</h1>
          <div class="header-buttons no-print"><button type="button" id="stampa">Stampa</button></div>
        </div>
        <section class="panel">
          <h2>Indirizzi</h2>
          <dl>
            <dt>Nesso</dt><dd>${esc(data.nesso || "")}</dd>
            <dt>Espo</dt><dd>${esc(data.espo || "")}</dd>
          </dl>
        </section>
        <section class="panel">
          <h2>Come si ferma la scrittura</h2>
          <p>${data.writesEnabled ? "Scritture accese." : "Scritture ferme."}</p>
          <p>Per fermare ogni scrittura, in Inizio si toglie la casella. Per fermarne una, sulla sua scheda si mette in pausa oppure si entra in modalità lettura.</p>
          ${windows ? `<p>Finestra di silenzio</p><ul>${windows}</ul>` : `<p>Nessuna finestra.</p>`}
        </section>
        ${blocks}
        <p class="hint">La pagina non contiene password né token.</p>
      `);
      const print = document.querySelector("#stampa");
      if (print) print.addEventListener("click", () => window.print());
    }

    function consegnaPage() {
      shell("Consegna", `<div class="page-header"><h1>Consegna</h1></div>`);
      fetch("/api/consegna").then(response => response.json()).then(paintConsegna).catch(() => {});
    }

    function render() {
      const path = pathOf();
      if (path === "/") return home();
      if (path === "/collegamenti") return connectionsPage();
      if (path === "/collegamenti/nuovo") return connectionFormPage(null);
      if (path.startsWith("/collegamenti/modifica/")) {
        const item = connectionOf(path.split("/")[3]);
        if (!item) return notFound();
        return connectionFormPage(item);
      }
      if (path === "/integrazioni") return integrationsPage();
      if (path === "/consegna") return consegnaPage();
      if (path.startsWith("/integrazioni/nuova")) {
        const step = Number(path.split("/")[3] || "1");
        return wizard(step);
      }
      if (path.startsWith("/integrazioni/modifica/")) {
        const bits = path.split("/");
        const item = (state.pipelines || []).find(row => row.id === bits[3]);
        if (!item) return notFound();
        if (!draft || draft.id !== item.id) draft = draftFromPipeline(item);
        return wizard(Number(bits[4] || "1"));
      }
      if (path === "/attivita") return activityPage();
      if (path === "/schede") return sheetsPage();
      if (path === "/schede/nuova") return newSheetPage();
      if (path.startsWith("/schede/")) return sheetPage(decodeURIComponent(path.split("/")[2] || ""));
      notFound();
    }

    function loginPage(primo) {
      document.body.classList.add("ingresso");
      document.body.classList.remove("dentro", "gesto-lancia");
      shell(primo ? "Primo ingresso" : "Entra", `
        <div class="page-header"><h1>${primo ? "Primo ingresso" : "Entra"}</h1></div>
        <p class="lead">${primo ? "Il primo ingresso cambia le integrazioni. Poi puoi aggiungere chi lancia i giri." : "Chi cambia le integrazioni, oppure chi le lancia e legge l'esito."}</p>
        <form class="panel" id="ingresso">
          <label>Nome<input name="name" autocomplete="username" required></label>
          <label>Password<input name="password" type="password" autocomplete="${primo ? "new-password" : "current-password"}" required></label>
          <p class="error" id="ingresso-errore"></p>
          <div class="actions"><button type="submit">${primo ? "Crea l'ingresso" : "Entra"}</button></div>
        </form>
      `);
      document.querySelector("#ingresso").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const response = await fetch(primo ? "/api/ingresso/primo" : "/api/ingresso", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: form.name.value.trim(), password: form.password.value })
        });
        const data = await response.json();
        if (!response.ok) {
          document.querySelector("#ingresso-errore").textContent = data.error || t("Ingresso non riuscito.");
          return;
        }
        session = data;
        await refresh();
      });
    }

    async function refresh() {
      const who = await fetch("/api/sessione");
      if (who.status === 401) {
        session = null;
        const denied = await who.json().catch(() => ({}));
        loginPage(Boolean(denied.primo));
        return;
      }
      session = await who.json();
      document.body.classList.remove("ingresso");
      document.body.classList.add("dentro");
      document.body.classList.toggle("gesto-lancia", session.gesture !== "cambia");
      const [stateResponse, healthResponse] = await Promise.all([fetch("/api/state"), fetch("/api/health")]);
      state = await stateResponse.json();
      health = await healthResponse.json();
      if (!catalog.length) {
        const data = await (await fetch("/api/catalog")).json();
        catalog = data.entities || [];
        if (data.espoPublicUrl) {
          espoUrl = data.espoPublicUrl;
          document.querySelector("#espo").href = espoUrl;
        }
      }
      render();
    }

    document.querySelector("#esci").addEventListener("click", async () => {
      await fetch("/api/uscita", { method: "POST" });
      session = null;
      await refresh();
    });
    window.addEventListener("hashchange", () => {
      const here = pathOf();
      if (!here.startsWith("/integrazioni/nuova") && !here.startsWith("/integrazioni/modifica")) draft = null;
      refresh();
    });
    document.querySelector("#lingua").addEventListener("change", (event) => {
      lang = event.target.value === "en" ? "en" : "it";
      localStorage.setItem("nesso-lang", lang);
      applyChrome();
      render();
    });
    async function boot() {
      try {
        const data = await (await fetch("/api/frasi")).json();
        en = data.en || {};
      } catch (error) {
        en = {};
      }
      applyChrome();
      if (!location.hash) location.hash = "#/";
      refresh();
    }
    boot();
  </script>
</body>
</html>
